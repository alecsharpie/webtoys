version: '3.8'

services:
  webtoys:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - webtoy_data:/app/storage
    env_file:
      - .env
    environment:
      - STORAGE_CONNECTION=/app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  webtoy_data: