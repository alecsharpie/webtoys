[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[project]
name = "webtoys"
version = "0.1.0"
description = "Create and share interactive HTML5 Canvas experiments with AI"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "anthropic>=0.49.0",
    "fastapi>=0.115.11",
    "uvicorn>=0.34.0",
    "pydantic>=2.4.2",
    "pydantic-settings>=2.0.3",
    "python-dotenv>=1.0.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.2",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "freezegun>=1.5.1",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.25.3",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
]
lint = [
    "mypy>=1.15.0",
    "ruff>=0.5.0",
]
pre-commit = [
    "pre-commit>=3.5.0",
]

[tool.uv]
default-groups = ["dev", "lint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"  # Default scope for all asyncio fixtures
markers = [
    "unit: marks a test as a unit test",
    "integration: marks a test as an integration test",
    "slow: marks a test as slow",
]

[tool.coverage.run]
source = ["backend"]
omit = ["backend/tests/*", "*/__pycache__/*", "*/venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true
# Exclude test fixtures with intentionally invalid code
exclude = [
    "tests/fixtures/claude_responses.py$",
    "backend/tests/.*",
]

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*", "httpx"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    "**/__pycache__",
    "**/venv",
    "**/.venv",
    "**/docs/conf.py",
    "**/tests/fixtures/claude_responses.py",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "B",    # flake8-bugbear
    "I",    # isort
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "RUF",  # ruff-specific rules
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "TID",  # flake8-tidy-imports
]

# Explicitly ignore certain rules.
ignore = [
    "B008",   # Allow function calls in default arguments for FastAPI dependencies
    "B904",   # We use FastAPI exception handling style without 'from'
    "E203",   # Conflicts with Black
    "E501",   # Line length governed by formatter
]

# Allow unused variables when underscore-prefixed or in test fixtures.
dummy-variable-rgx = "^(_|dummy|unused).*$"

[tool.ruff.lint.isort]
known-first-party = ["services", "config"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.per-file-ignores]
# Allow wildcard imports in __init__ files
"**/__init__.py" = ["F403"]
# Ignore specific errors in test files
"**/tests/**" = [
    "E501",      # Long lines are sometimes needed in test data
    "N802",      # Allow function names like test_API_errors in tests
    "B018",      # Allow useless expressions in test assertions
]
# Exclude test fixtures with intentionally broken syntax for testing
"**/tests/fixtures/claude_responses.py" = ["ALL"]
"**/tests/fixtures/sample_webtoys.py" = ["F401", "UP035", "UP006"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"