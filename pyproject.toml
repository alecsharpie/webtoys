[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "webtoys"
version = "0.1.0"
description = "Create and share interactive HTML5 Canvas experiments with AI"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn>=0.23.2",
    "pydantic>=2.4.2",
    "pydantic-settings>=2.0.3",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.1",
    "jinja2>=3.1.2",
    "python-multipart>=0.0.6",
]

[dependency-groups]
dev = [
    "pytest>=7.4.3,<8",
    "pytest-asyncio>=0.21.1,<0.22",
    "pytest-cov>=4.1.0,<5",
    "httpx>=0.25.1,<0.26",
    "asgi-lifespan>=2.1.0,<3",
]
lint = [
    "mypy>=1.5.1,<2",
    "ruff>=0.5.0,<0.6",
]
pre-commit = [
    "pre-commit>=3.5.0,<4",
]

[tool.uv]
default-groups = ["dev", "lint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
asyncio_mode = "auto"
markers = [
    "unit: marks a test as a unit test",
    "integration: marks a test as an integration test",
    "slow: marks a test as slow",
]

[tool.coverage.run]
source = ["backend"]
omit = ["backend/tests/*", "*/__pycache__/*", "*/venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
# Exclude test fixtures with intentionally invalid code
exclude = [
    "tests/fixtures/claude_responses.py$",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    "**/__pycache__",
    "**/venv",
    "**/.venv",
    "**/docs/conf.py",
    "**/tests/fixtures/claude_responses.py",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "B",    # flake8-bugbear
    "I",    # isort
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "RUF",  # ruff-specific rules
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "TID",  # flake8-tidy-imports
]

# Explicitly ignore certain rules.
ignore = [
    "B008",   # Allow function calls in default arguments for FastAPI dependencies
    "B904",   # We use FastAPI exception handling style without 'from'
    "E203",   # Conflicts with Black
    "E501",   # Line length governed by formatter
]

# Allow unused variables when underscore-prefixed or in test fixtures.
dummy-variable-rgx = "^(_|dummy|unused).*$"

[tool.ruff.lint.isort]
known-first-party = ["services", "config"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.per-file-ignores]
# Allow wildcard imports in __init__ files
"**/__init__.py" = ["F403"]
# Ignore specific errors in test files
"**/tests/**" = [
    "E501",      # Long lines are sometimes needed in test data
    "N802",      # Allow function names like test_API_errors in tests
    "B018",      # Allow useless expressions in test assertions
]
# Exclude test fixtures with intentionally broken syntax for testing
"**/tests/fixtures/claude_responses.py" = ["ALL"]
"**/tests/fixtures/sample_webtoys.py" = ["F401", "UP035", "UP006"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

